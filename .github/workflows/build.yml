name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unzip project
        run: unzip -q project.zip -d proj
      - name: Build debug APK
        run: |
          DIR=$(dirname "$(find proj -name 'settings.gradle*' | head -n1)")
          cd "$DIR"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: proj/**/build/outputs/apk/debug/*.apk
