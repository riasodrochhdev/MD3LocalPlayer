name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Версия зафиксирована: ubuntu-latest с 19.10.2026 переезжает на Ubuntu 26
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # В проекте нет gradlew / gradle-wrapper.jar, поэтому ставим тот же Gradle,
      # что указан в gradle/wrapper/gradle-wrapper.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mediateka-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
